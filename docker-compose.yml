name: generation

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
  WEBHOOK_SECRET: dev-shared-secret
  PROVIDER_TIMEOUT_SECONDS: "60"
  DISPATCH_TIMEOUT_SECONDS: "10"
  WATCHDOG_ENABLED: "true"
  WATCHDOG_INTERVAL_SECONDS: "2"
  MAX_ACTIVE_TASKS: "3"
  ALPHA_URL: http://alpha:8001
  BETA_URL: http://beta:8002
  WEBHOOK_BASE_URL: http://service:8000
  SERVICE_BASE_URL: http://service:8000

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    # на хосте 5433, чтобы не воевать с локальным постгресом
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 2s
      retries: 30

  # одноразовый прогон миграций
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy

  service:
    build: .
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 3s
      timeout: 3s
      retries: 20

  alpha:
    build: .
    command: ["uvicorn", "providers.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      <<: *app-env
      PROVIDER_NAME: alpha
    ports:
      - "8001:8001"

  beta:
    build: .
    command: ["uvicorn", "providers.main:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      <<: *app-env
      PROVIDER_NAME: beta
    ports:
      - "8002:8002"

  tests:
    build: .
    profiles: ["tools"]
    command: ["pytest", "-q"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      service:
        condition: service_healthy
      alpha:
        condition: service_started
      beta:
        condition: service_started

volumes:
  pgdata:
